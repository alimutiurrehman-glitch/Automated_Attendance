name: attendance_app
description: "Automated Classroom Attendance Marker - Flutter Android App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  google_sign_in: ^6.2.1

  # Image handling
  image_picker: ^1.1.2

  # HTTP client for backend API
  http: ^1.3.0

  # State management
  provider: ^6.1.4

  # Date formatting
  intl: ^0.20.2

  # UUID generation
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
